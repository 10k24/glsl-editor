<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLSL Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%237aa2f7'/><text y='72' x='12' font-size='54' font-family='monospace' font-weight='bold' fill='white'>GL</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      <header id="header">
        <span id="logo">GLSL</span>
        <span id="app-title">Shader Editor</span>
        <div id="status">
          <span id="status-ok" class="status-dot ok">● live</span>
          <span id="status-err" class="status-dot err hidden">✕ compile error</span>
        </div>
        <div id="toolbar">
          <label id="ac-toggle">
            <input type="checkbox" id="ac-checkbox"> autocomplete
          </label>
        </div>
      </header>
      <div id="body">
        <div id="editor-pane">
          <div id="editor-cm"></div>
          <div id="info-panel"></div>
        </div>
        <div id="divider"></div>
        <div id="preview-pane">
          <canvas id="canvas"></canvas>
          <div id="error-overlay" class="hidden"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

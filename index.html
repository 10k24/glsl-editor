    <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />

  <body>
    <div id="app">
      <header id="header">
        <a id="brand-link" href="https://10k24.com" target="_blank" rel="noopener noreferrer" aria-label="10k24 Studio">
          <img id="brand-logo" src="/img/10k24_shortform_logo.svg" alt="10k24 Studio" draggable="false" />
        </a>
        <span id="app-title">GLSL Editor</span>
        <div id="status">
          <span id="fps" class="hidden"></span>
          <span id="status-ok" class="status-dot ok">● Live</span>
          <span id="status-err" class="status-dot err hidden">✕ Compile Error</span>
        </div>
        <div id="toolbar">
          <label id="ac-toggle">
            <input type="checkbox" id="ac-checkbox" checked> Autocomplete
          </label>
          <button id="pause-btn" type="button" title="Pause or resume rendering">Pause</button>
          <button id="reset-btn" type="button" title="Restore the default shader">Reset</button>
          <button id="present-btn" type="button" title="Present the shader full-screen">Present</button>
          <button id="share-btn" type="button" title="Copy a link to this shader">Share</button>
          
        </div>
      </header>
      <button id="exit-present-btn" type="button" title="Back to editor (Esc)">Exit</button>
      <div id="body">
        <div id="editor-pane">
          <div id="editor-cm"></div>
          <div id="define-panel" class="hidden"></div>
          <div id="info-panel"></div>
        </div>
        <div id="divider"></div>
        <div id="preview-pane">
          <canvas id="canvas"></canvas>
          <div id="error-overlay" class="hidden"></div>
        </div>
      </div>
      <footer id="footer">
        <span id="footer-copy">&copy; <span id="year"></span> 10k24 Studio. Los Angeles, California.</span>
        <nav id="footer-links" aria-label="Footer links">
          <a href="https://github.com/10k24" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://instagram.com/10k24.studio" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="mailto:info@10k24.com">info@10k24.com</a>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
